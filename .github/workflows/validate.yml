name: validate

on:
  push:
  pull_request:

jobs:
  skill-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py assets/build_scene.template.py
      - run: python scripts/run_synthetic_benchmark.py --report /tmp/ssr_benchmark.md
      - run: python scripts/init_render_project.py /tmp/ssr-project --title "CI synthetic project" --domain general --views physical-setup
      - name: Confirm starter evidence question blocks modeling
        run: |
          if python scripts/validate_scene_manifest.py /tmp/ssr-project/scene_manifest.json --report /tmp/ssr-project/qa/manifest.md; then
            echo "Starter manifest unexpectedly passed with an unresolved blocking question"
            exit 1
          fi
          grep -q "U008" /tmp/ssr-project/qa/manifest.md
      - run: python scripts/audit_public_release.py .
